server {
    listen 80;
    server_name localhost;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Enable CORS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-hasura-admin-secret' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # =========================================================================
    # VoxGuard (at /voxguard/)
    # =========================================================================
    location /voxguard/ {
        set $upstream_web web;
        rewrite ^/voxguard/(.*) /$1 break;
        proxy_pass http://$upstream_web:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Redirect Root to /voxguard/
    location / {
        return 301 /voxguard/;
    }

    # Redirect /voxguard to / - REMOVED request from user
    # location /voxguard {
    #     return 301 /;
    # }

    # VoxGuard API
    location /api/v1/management/ {
        set $upstream_api management-api;
        rewrite ^/api/v1/management/(.*) /api/v1/$1 break;
        proxy_pass http://$upstream_api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hasura GraphQL
    location /v1/graphql {
        set $upstream_hasura hasura;
        proxy_pass http://$upstream_hasura:8080/v1/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # =========================================================================
    # Project Catalyst (Legacy Dashboard) -> /catalyst/
    # =========================================================================
    location /catalyst/ {
        # Trailing slash is critical to strip /catalyst/ from the request path
        set $upstream_catalyst project-catalyst-dashboard-ui;
        proxy_pass http://$upstream_catalyst:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # Project Catalyst API Routes (Preserved)
    # =========================================================================
    
    # Messaging Hub
    location /api/v1/messages {
        set $upstream_mh messaging-hub;
        proxy_pass http://$upstream_mh:8085/api/v1/messages;
    }
    location /api/v1/providers {
        set $upstream_mh messaging-hub;
        proxy_pass http://$upstream_mh:8085/api/v1/providers;
    }
    location /api/v1/pricing/ {
        set $upstream_mh messaging-hub;
        proxy_pass http://$upstream_mh:8085/api/v1/pricing/;
    }
    location /api/v1/dnd/ {
        set $upstream_mh messaging-hub;
        proxy_pass http://$upstream_mh:8085/api/v1/dnd/;
    }
    
    # Interactive Gateway
    location /api/v1/flows {
        set $upstream_ig interactive-gateway;
        proxy_pass http://$upstream_ig:8084/api/v1/flows;
    }
    location /api/v1/sessions {
        set $upstream_ig interactive-gateway;
        proxy_pass http://$upstream_ig:8084/api/v1/sessions;
    }

    # Ingress (USSD/SMPP)
    location /api/v1/ingress/ {
        set $upstream_ig interactive-gateway;
        proxy_pass http://$upstream_ig:8084/api/v1/ingress/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # WebSocket support
    location /ws/stats {
        set $upstream_ig interactive-gateway;
        proxy_pass http://$upstream_ig:8084/ws/stats;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Firewall
    location /api/v1/policies {
        set $upstream_fw firewall-service;
        proxy_pass http://$upstream_fw:8083/api/v1/policies;
    }
    location /api/v1/incidents {
        set $upstream_fw firewall-service;
        proxy_pass http://$upstream_fw:8083/api/v1/incidents;
    }
}
